# Manual fallback for hosts that cannot reach the official PyTorch CPU wheel CDN.
# Builds exactly the repository Dockerfile; does not download model weights.
name: Stage 8 Docker remote build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set lowercase GHCR tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:stage8" >> "$GITHUB_OUTPUT"

      - name: Build image from official CPU-only dependencies
        shell: bash
        run: docker build --progress=plain -t "${{ steps.image.outputs.name }}" .

      # Verifies the packaged ASGI app; a real model smoke still must be run
      # after pulling the image because inference lazily downloads ~1.2 GB.
      - name: Start container and check HTTP endpoints
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mt5-stage8-ci --memory 6g --cpus 2 \
            -p 127.0.0.1:18000:8000 "${{ steps.image.outputs.name }}"
          trap 'docker logs --tail 80 mt5-stage8-ci || true; docker rm -f mt5-stage8-ci || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:18000/api/v1/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl -fsS --max-time 5 http://127.0.0.1:18000/openapi.json \
            | python3 -c "import json,sys; paths=json.load(sys.stdin)['paths']; assert all('/api/v1/summarization/'+name in paths for name in ('text','file','files'))"

      - name: Authenticate to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish validated image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "$IMAGE"
